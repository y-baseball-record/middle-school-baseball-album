<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>成長記録</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f6f8;color:#102b4e;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}.app{max-width:520px;margin:auto;min-height:100vh;background:#fff}.top{background:#102b4e;color:white;padding:22px 20px 18px}.top h1{font-size:22px;margin:0 0 6px}.top p{font-size:12px;margin:0;opacity:.85}.screen{display:none;padding:18px}.screen.active{display:block}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:20px}.tabs button{border:0;border-radius:22px;padding:12px 4px;background:#edf2f6;color:#42607d;font-weight:bold}.tabs button.active{background:#102b4e;color:white}.section-title{font-size:15px;font-weight:bold;margin:18px 0 10px}.card{border:1px solid #e0e8ef;border-radius:15px;padding:14px;margin:10px 0;box-shadow:0 2px 8px #102b4e0b}.record-head{display:flex;justify-content:space-between;gap:8px;font-weight:bold}.muted{font-size:12px;color:#71859a}.field{margin:12px 0}.field label{display:block;font-size:12px;font-weight:bold;margin-bottom:6px}.field input,.field textarea,.field select{width:100%;border:1px solid #d7e2eb;border-radius:10px;padding:12px;background:#fbfdff;color:#102b4e}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.primary{width:100%;border:0;border-radius:24px;background:#e92332;color:#fff;font-weight:bold;padding:14px;margin-top:12px}.secondary{width:100%;border:1px solid #d5e0e9;border-radius:24px;background:#eef4f8;color:#244764;font-weight:bold;padding:13px;margin-top:8px}.checklist label{display:block;padding:7px 0;font-size:13px}.checklist input{accent-color:#e92332;margin-right:8px}.empty{text-align:center;color:#8a9aaa;padding:28px 10px;font-size:13px}.back{border:0;background:none;color:#fff;padding:0 0 12px;font-weight:bold}.status{font-size:12px;color:#e92332;min-height:18px}.bottom{display:flex;gap:8px;padding:12px 18px 18px;border-top:1px solid #e7edf2}.bottom button{flex:1;border:0;background:white;color:#526d86;font-size:11px}.bottom button.active{color:#e92332;font-weight:bold}.smallbtn{border:0;background:#edf3f7;color:#365773;border-radius:18px;padding:7px 12px;font-size:12px}
</style>
<style id="unified-navigation-style">
.unified-nav{position:sticky;top:0;z-index:50;background:#0b223d;padding:9px 10px;box-shadow:0 2px 8px rgba(0,0,0,.12);overflow-x:auto;-webkit-overflow-scrolling:touch}
.unified-nav-inner{display:flex;gap:7px;min-width:max-content;max-width:520px;margin:0 auto}
.unified-nav a{display:block;text-decoration:none;white-space:nowrap;border:1px solid rgba(255,255,255,.35);border-radius:18px;padding:8px 12px;color:#fff;font-size:12px;font-weight:700;background:rgba(255,255,255,.08)}
.unified-nav a.active{background:#e92332;border-color:#e92332}
@media(min-width:700px){.unified-nav-inner{max-width:900px;justify-content:center}.unified-nav a{font-size:13px;padding:9px 14px}}
</style>

<style id="common-footer-style">
.common-footer{display:flex;gap:8px;padding:10px 16px 18px;border-top:1px solid #e7edf2;background:#fff}
.common-footer a{flex:1;text-align:center;text-decoration:none;color:#71839b;font-size:11px;padding:7px 2px;border-radius:12px}
.common-footer a .footer-icon{display:block;font-size:24px;line-height:1.2;margin-bottom:4px}
.common-footer a.active{color:#e92332;font-weight:800}
</style>
</head><body>
<nav class="unified-nav" aria-label="記録メニュー"><div class="unified-nav-inner"><a href="../試合記録/index.html">試合記録</a><a href="../成長記録/index.html" class="active">成長記録</a><a href="../練習記録/index.html">練習記録</a><a href="../ケガ・コンディション/index.html">ケガ・コンディション</a><a href="../野球用品/index.html">野球用品</a><a href="../写真・思い出/index.html">写真・思い出</a></div></nav>
<div class="app"><header class="top"><h1>身長・体重・食事・身体づくり</h1><p>変化があったときに、無理なく記録</p></header>
<section id="growth-screen" class="screen active"><div class="tabs" id="main-tabs"><button class="active" data-tab="measure">身長・体重</button><button data-tab="food">食事</button><button data-tab="body">身体づくり</button></div><div id="measure-panel"><div class="section-title">最近の記録</div><div id="measure-list"><div class="empty">読み込み中…</div></div><button class="primary" onclick="openForm('measure')">＋ 身長・体重を記録する</button></div><div id="food-panel" hidden><div class="section-title">最近の食事記録</div><div id="food-list"><div class="empty">読み込み中…</div></div><button class="primary" onclick="openForm('food')">＋ 食事を記録する</button></div><div id="body-panel" hidden><div class="section-title">最近の身体づくり</div><div id="body-list"><div class="empty">読み込み中…</div></div><button class="primary" onclick="openForm('body')">＋ 身体づくりを記録する</button></div></section>
<section id="form-screen" class="screen"><button class="smallbtn" onclick="show('growth-screen')">← 戻る</button><h2 id="form-title">記録</h2><form id="record-form" onsubmit="saveRecord(event)"><div class="field"><label>日付</label><input type="date" id="date" required></div><div id="measure-fields"><div class="grid2"><div class="field"><label>身長（cm・任意）</label><input type="number" step="0.1" id="height"></div><div class="field"><label>体重（kg・任意）</label><input type="number" step="0.1" id="weight"></div></div><p class="muted">身長と体重は別々の日に記録できます。</p></div><div id="food-fields" hidden><div class="field"><label>最近の食事の変化（必須）</label><textarea id="food-change" rows="3" placeholder="最近、夕食のご飯をよく食べるようになった。"></textarea></div><div class="field"><label>よく食べているもの</label><input id="food-favorite" placeholder="たんぱく質・鶏肉・魚など"></div><div class="field"><label>今のブーム</label><input id="food-trend" placeholder="最近よく食べるもの"></div><div class="field"><label>メモ</label><textarea id="food-note" rows="2"></textarea></div></div><div id="body-fields" hidden><div class="field"><label>取り組んだこと（複数選択可）</label><div class="checklist"><label><input type="checkbox" value="ストレッチ">ストレッチ</label><label><input type="checkbox" value="体幹">体幹</label><label><input type="checkbox" value="柔軟">柔軟</label><label><input type="checkbox" value="姿勢">姿勢</label><label><input type="checkbox" value="その他">その他</label></div></div><div class="field"><label>その他（任意）</label><input id="body-other"></div><div class="field"><label>変化・気づき</label><textarea id="body-change" rows="2" placeholder="少し体が軽く感じた。"></textarea></div><div class="field"><label>メモ</label><textarea id="body-note" rows="2"></textarea></div></div><div id="form-status" class="status"></div><button class="primary">保存する</button></form></section>
</div>
<script>
const $=id=>document.getElementById(id);let mode='measure',editingId=null;const client=(typeof supabaseClient!=='undefined')?supabaseClient:null;
function show(id){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));$(id).classList.add('active');scrollTo(0,0)}
function setTab(tab){mode=tab;document.querySelectorAll('#main-tabs button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));['measure','food','body'].forEach(t=>$(t+'-panel').hidden=t!==tab);loadAll()}
document.querySelectorAll('#main-tabs button').forEach(b=>b.onclick=()=>setTab(b.dataset.tab));
function openForm(type){mode=type;editingId=null;$('record-form').reset();$('date').value=new Date().toISOString().slice(0,10);$('form-title').textContent=type==='measure'?'身長・体重を記録':type==='food'?'食事を記録':'身体づくりを記録';['measure','food','body'].forEach(t=>$(t+'-fields').hidden=t!==type);$('form-status').textContent='';show('form-screen')}
function esc(s){return String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
async function loadAll(){if(!client)return;loadMeasures();loadFoods();loadBodies()}
async function loadMeasures(){const r=await client.from('growth_measurements').select('*').order('record_date',{ascending:false}).order('id',{ascending:false});if(r.error){$('measure-list').innerHTML='<div class="empty">身長・体重テーブル未設定です。</div>';return}$('measure-list').innerHTML=r.data.length?r.data.map(x=>`<div class="card"><div class="record-head"><span>${x.record_date}</span><button class="smallbtn" onclick="removeRecord('growth_measurements',${x.id})">削除</button></div><div>${x.height_cm!=null?'身長 '+x.height_cm+' cm':'身長 未入力'}　${x.weight_kg!=null?'体重 '+x.weight_kg+' kg':'体重 未入力'}</div><div class="muted">${esc(x.note||'')}</div></div>`).join(''):'<div class="empty">まだ記録がありません。</div>'}
async function loadFoods(){const r=await client.from('food_records').select('*').order('record_date',{ascending:false}).order('id',{ascending:false});if(r.error){$('food-list').innerHTML='<div class="empty">食事テーブル未設定です。</div>';return}$('food-list').innerHTML=r.data.length?r.data.map(x=>`<div class="card"><div class="record-head"><span>${x.record_date}</span><button class="smallbtn" onclick="removeRecord('food_records',${x.id})">削除</button></div><div>${esc(x.change_text)}</div><div class="muted">${esc(x.favorite_food||'')} ${esc(x.trend||'')}</div></div>`).join(''):'<div class="empty">まだ記録がありません。</div>'}
async function loadBodies(){const r=await client.from('body_building_records').select('*').order('record_date',{ascending:false}).order('id',{ascending:false});if(r.error){$('body-list').innerHTML='<div class="empty">身体づくりテーブル未設定です。</div>';return}$('body-list').innerHTML=r.data.length?r.data.map(x=>`<div class="card"><div class="record-head"><span>${x.record_date}</span><button class="smallbtn" onclick="removeRecord('body_building_records',${x.id})">削除</button></div><div>${esc(x.activities||'')}</div><div class="muted">${esc(x.change_text||'')}</div></div>`).join(''):'<div class="empty">まだ記録がありません。</div>'}
async function saveRecord(e){
e.preventDefault();
const status=$('form-status');
const saveButton=document.querySelector('#record-form button.primary');
status.textContent='保存中…';
if(saveButton)saveButton.disabled=true;
try{
if(!client)throw new Error('Supabaseとの接続設定が読み込まれていません。supabase-config.jsを確認してください。');
let table,data;
if(mode==='measure'){
table='growth_measurements';
data={record_date:$('date').value,height_cm:$('height').value===''?null:Number($('height').value),weight_kg:$('weight').value===''?null:Number($('weight').value),note:null};
if(data.height_cm==null&&data.weight_kg==null){status.textContent='身長または体重を1つ以上入力してください。';return}
}else if(mode==='food'){
table='food_records';
data={record_date:$('date').value,change_text:$('food-change').value.trim(),favorite_food:$('food-favorite').value.trim()||null,trend:$('food-trend').value.trim()||null,note:$('food-note').value.trim()||null};
if(!data.change_text){status.textContent='食事の変化を入力してください。';return}
}else{
table='body_building_records';
const acts=[...document.querySelectorAll('#body-fields input[type=checkbox]:checked')].map(x=>x.value);
if($('body-other').value.trim())acts.push($('body-other').value.trim());
data={record_date:$('date').value,activities:acts.join('、')||null,change_text:$('body-change').value.trim()||null,note:$('body-note').value.trim()||null};
}
const result=await Promise.race([
client.from(table).insert(data),
new Promise((_,reject)=>setTimeout(()=>reject(new Error('保存処理が15秒以内に完了しませんでした。Supabaseのテーブル作成・Data API公開設定・RLSポリシーを確認してください。')),15000))
]);
if(result.error)throw new Error(result.error.message);
status.textContent='保存しました。';
show('growth-screen');
await loadAll();
}catch(err){
console.error(err);
status.textContent='保存できませんでした：'+(err.message||err);
}finally{if(saveButton)saveButton.disabled=false;}
}
async function removeRecord(table,id){if(!confirm('この記録を削除しますか？'))return;const r=await client.from(table).delete().eq('id',id);if(r.error)alert(r.error.message);await loadAll()}
loadAll();
</script><nav class="common-footer" aria-label="下部メニュー"><a href="../試合記録/index.html" class=""><span class="footer-icon">⚾</span>試合</a><a href="../index.html" class=""><span class="footer-icon">⌂</span>ホーム</a><a href="../record-menu.html" class="active"><span class="footer-icon">☰</span>その他</a></nav></body></html>

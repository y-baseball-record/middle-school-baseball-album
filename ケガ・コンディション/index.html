<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ケガ・コンディション</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script>
<style>*{box-sizing:border-box}body{margin:0;background:#f3f6f8;color:#102b4e;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif}.app{max-width:520px;margin:auto;min-height:100vh;background:#fff}.top{background:#102b4e;color:#fff;padding:20px}.top h1{font-size:22px;margin:0 0 5px}.top p{font-size:12px;margin:0;opacity:.85}.screen{display:none;padding:18px}.screen.active{display:block}.back{border:0;background:none;color:#fff;padding:0 0 12px;font-weight:bold;font-size:15px}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:18px}.tabs button{border:0;border-radius:22px;padding:11px 4px;background:#edf2f6;color:#42607d;font-weight:bold}.tabs button.active{background:#e92332;color:white}.card{border:1px solid #e0e8ef;border-radius:15px;padding:14px;margin:10px 0;box-shadow:0 2px 8px #102b4e0b}.head{display:flex;justify-content:space-between;gap:8px;font-weight:bold}.muted{font-size:12px;color:#71859a}.field{margin:12px 0}.field label{display:block;font-size:12px;font-weight:bold;margin-bottom:6px}.field input,.field textarea,.field select{width:100%;border:1px solid #d7e2eb;border-radius:10px;padding:12px;background:#fbfdff;color:#102b4e}.primary{width:100%;border:0;border-radius:24px;background:#e92332;color:#fff;font-weight:bold;padding:14px;margin-top:12px}.secondary{width:100%;border:1px solid #d5e0e9;border-radius:24px;background:#eef4f8;color:#244764;font-weight:bold;padding:13px;margin-top:8px}.small{border:0;background:#edf3f7;color:#365773;border-radius:18px;padding:7px 12px;font-size:12px}.status{font-size:12px;color:#e92332;min-height:20px;margin-top:8px}.empty{text-align:center;color:#8a9aaa;padding:28px 10px;font-size:13px}.bottom{display:flex;gap:8px;padding:12px 18px 18px;border-top:1px solid #e7edf2}.bottom button{flex:1;border:0;background:#fff;color:#526d86;font-size:11px}.bottom button.active{color:#e92332;font-weight:bold}.pill{display:inline-block;background:#edf3f7;border-radius:15px;padding:4px 8px;font-size:11px;margin:3px 3px 0 0}.danger{color:#e92332}.detail-title{font-size:18px;margin:8px 0}.section{font-weight:bold;margin:18px 0 8px}</style>
<style id="unified-navigation-style">
.unified-nav{position:sticky;top:0;z-index:50;background:#0b223d;padding:9px 10px;box-shadow:0 2px 8px rgba(0,0,0,.12);overflow-x:auto;-webkit-overflow-scrolling:touch}
.unified-nav-inner{display:flex;gap:7px;min-width:max-content;max-width:520px;margin:0 auto}
.unified-nav a{display:block;text-decoration:none;white-space:nowrap;border:1px solid rgba(255,255,255,.35);border-radius:18px;padding:8px 12px;color:#fff;font-size:12px;font-weight:700;background:rgba(255,255,255,.08)}
.unified-nav a.active{background:#e92332;border-color:#e92332}
@media(min-width:700px){.unified-nav-inner{max-width:900px;justify-content:center}.unified-nav a{font-size:13px;padding:9px 14px}}
</style>

<style id="common-footer-style">
.common-footer{display:flex;gap:8px;padding:10px 16px 18px;border-top:1px solid #e7edf2;background:#fff}
.common-footer a{flex:1;text-align:center;text-decoration:none;color:#71839b;font-size:11px;padding:7px 2px;border-radius:12px}
.common-footer a .footer-icon{display:block;font-size:24px;line-height:1.2;margin-bottom:4px}
.common-footer a.active{color:#e92332;font-weight:800}
</style>
</head><body>
<nav class="unified-nav" aria-label="記録メニュー"><div class="unified-nav-inner"><a href="../試合記録/index.html">試合記録</a><a href="../成長記録/index.html">成長記録</a><a href="../練習記録/index.html">練習記録</a><a href="../ケガ・コンディション/index.html" class="active">ケガ・コンディション</a><a href="../野球用品/index.html">野球用品</a><a href="../写真・思い出/index.html">写真・思い出</a></div></nav>
<div class="app"><header class="top"><h1>ケガ・コンディションを記録する</h1><p>変化や治療・復帰までを記録</p></header>
<section id="list-screen" class="screen active"><div class="tabs" id="filter-tabs"><button class="active" data-filter="all">すべて</button><button data-filter="ongoing">継続中</button><button data-filter="done">完治</button></div><div id="record-list"><div class="empty">読み込み中…</div></div><button class="primary" onclick="openForm()">＋ ケガ・コンディションを追加</button></section>
<section id="form-screen" class="screen"><button class="small" onclick="show('list-screen')">← 戻る</button><h2 id="form-title">ケガ・コンディションを記録する</h2><form id="record-form" onsubmit="saveRecord(event)"><div class="field"><label>発生日</label><input type="date" id="onset-date" required></div><div class="field"><label>完治日（分かる場合）</label><input type="date" id="recovery-date"></div><div class="field"><label>現在も継続中</label><select id="ongoing"><option value="true">継続中</option><option value="false">完治</option></select></div><div class="field"><label>ケガ・コンディションの名前</label><input id="condition-name" required placeholder="例：オスグッド・右足首の捻挫"></div><div class="field"><label>メモ</label><textarea id="memo" rows="4" placeholder="症状やきっかけ、診察内容など"></textarea></div><div class="section">治療・ケアの内容</div><div id="care-checks"><label><input type="checkbox" value="病院受診"> 病院受診</label><label><input type="checkbox" value="電気治療"> 電気治療</label><label><input type="checkbox" value="ストレッチ"> ストレッチ</label><label><input type="checkbox" value="テーピング"> テーピング</label><label><input type="checkbox" value="サポーター"> サポーター</label><label><input type="checkbox" value="その他"> その他</label></div><div class="field"><label>治療・ケアの詳細</label><textarea id="care-detail" rows="3" placeholder="通院回数や具体的な治療内容など"></textarea></div><div class="field"><label>復帰の時期・状況</label><input id="return-status" placeholder="例：8/23 ピッチャーで復帰"></div><div id="form-status" class="status"></div><button class="primary" id="save-button">保存する</button></form></section>
<section id="detail-screen" class="screen"><button class="small" onclick="show('list-screen')">← 一覧へ戻る</button><div id="detail-content"></div></section>
</div>
<script>const $=id=>document.getElementById(id);let filter='all',editingId=null;const client=window.supabaseClient||((typeof supabaseClient!=='undefined')?supabaseClient:null);function show(id){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));$(id).classList.add('active');scrollTo(0,0)}function esc(s){return String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}document.querySelectorAll('#filter-tabs button').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;document.querySelectorAll('#filter-tabs button').forEach(x=>x.classList.toggle('active',x===b));loadRecords()});function openForm(id=null){editingId=id;$('record-form').reset();$('onset-date').value=new Date().toISOString().slice(0,10);$('form-title').textContent=id?'ケガ・コンディションを編集':'ケガ・コンディションを記録する';$('form-status').textContent='';document.querySelectorAll('#care-checks input').forEach(x=>x.checked=false);if(id)loadForEdit(id);else show('form-screen')}async function loadForEdit(id){if(!client)return;const r=await client.from('injury_conditions').select('*').eq('id',id).single();if(r.error){alert(r.error.message);return}const x=r.data;$('onset-date').value=x.onset_date||'';$('recovery-date').value=x.recovery_date||'';$('ongoing').value=String(x.is_ongoing);$('condition-name').value=x.condition_name||'';$('memo').value=x.memo||'';$('care-detail').value=x.care_detail||'';$('return-status').value=x.return_status||'';document.querySelectorAll('#care-checks input').forEach(c=>c.checked=(x.care_types||'').split('、').includes(c.value));show('form-screen')}async function loadRecords(){if(!client){$('record-list').innerHTML='<div class="empty">Supabaseとの接続設定が読み込まれていません。</div>';return}let q=client.from('injury_conditions').select('*').order('onset_date',{ascending:false}).order('id',{ascending:false});if(filter==='ongoing')q=q.eq('is_ongoing',true);if(filter==='done')q=q.eq('is_ongoing',false);const r=await q;if(r.error){$('record-list').innerHTML='<div class="empty">テーブル未設定：'+esc(r.error.message)+'</div>';return}$('record-list').innerHTML=r.data.length?r.data.map(x=>`<div class="card" onclick="showDetail(${x.id})"><div class="head"><span>${esc(x.onset_date)}〜${x.recovery_date?esc(x.recovery_date):'現在'}</span><span class="pill">${x.is_ongoing?'継続中':'完治'}</span></div><div class="detail-title">${esc(x.condition_name)}</div><div class="muted">${esc(x.memo||'')}</div><div>${(x.care_types||'').split('、').filter(Boolean).map(t=>`<span class="pill">${esc(t)}</span>`).join('')}</div></div>`).join(''):'<div class="empty">まだ記録がありません。</div>'}async function showDetail(id){const r=await client.from('injury_conditions').select('*').eq('id',id).single();if(r.error){alert(r.error.message);return}const x=r.data;$('detail-content').innerHTML=`<div class="head"><span>ケガ・コンディション詳細</span><button class="small" onclick="openForm(${x.id})">編集</button></div><div class="card"><div class="detail-title">${esc(x.condition_name)} <span class="pill">${x.is_ongoing?'継続中':'完治'}</span></div><div class="muted">発生日：${esc(x.onset_date)}　完治日：${esc(x.recovery_date||'未入力')}</div><div class="section">メモ</div><div>${esc(x.memo||'未入力')}</div><div class="section">治療・ケアの内容</div><div>${(x.care_types||'').split('、').filter(Boolean).map(t=>`<span class="pill">${esc(t)}</span>`).join('')||'未入力'}</div><div class="section">治療・ケアの詳細</div><div>${esc(x.care_detail||'未入力')}</div><div class="section">復帰の時期・状況</div><div>${esc(x.return_status||'未入力')}</div></div><button class="primary" onclick="removeRecord(${x.id})">削除する</button>`;show('detail-screen')}async function saveRecord(e){e.preventDefault();const status=$('form-status'),btn=$('save-button');status.textContent='保存中…';btn.disabled=true;try{if(!client)throw new Error('Supabaseとの接続設定が読み込まれていません。supabase-config.jsを確認してください。');const care=[...document.querySelectorAll('#care-checks input:checked')].map(x=>x.value);const data={onset_date:$('onset-date').value,recovery_date:$('recovery-date').value||null,is_ongoing:$('ongoing').value==='true',condition_name:$('condition-name').value.trim(),memo:$('memo').value.trim()||null,care_types:care.join('、')||null,care_detail:$('care-detail').value.trim()||null,return_status:$('return-status').value.trim()||null};const r=editingId?await client.from('injury_conditions').update(data).eq('id',editingId):await client.from('injury_conditions').insert(data);if(r.error)throw new Error(r.error.message);show('list-screen');await loadRecords()}catch(err){console.error(err);status.textContent='保存できませんでした：'+err.message}finally{btn.disabled=false}}async function removeRecord(id){if(!confirm('この記録を削除しますか？'))return;const r=await client.from('injury_conditions').delete().eq('id',id);if(r.error){alert(r.error.message);return}show('list-screen');loadRecords()}loadRecords();</script><nav class="common-footer" aria-label="下部メニュー"><a href="../試合記録/index.html" class=""><span class="footer-icon">⚾</span>試合</a><a href="../index.html" class=""><span class="footer-icon">⌂</span>ホーム</a><a href="../record-menu.html" class="active"><span class="footer-icon">☰</span>その他</a></nav></body></html>

<!doctype html>
<html lang="ja">

<head>

<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1"
>

<title>ケガ・コンディション</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>


<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#f3f6f8;
  color:#102b4e;
  font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif;
}

.app{
  max-width:520px;
  margin:auto;
  min-height:100vh;
  background:#fff;
}

.top{
  background:#102b4e;
  color:#fff;
  padding:20px;
}

.top h1{
  font-size:22px;
  margin:0 0 5px;
}

.top p{
  font-size:12px;
  margin:0;
  opacity:.85;
}

.screen{
  display:none;
  padding:18px;
}

.screen.active{
  display:block;
}


/* 一覧上部 */

.list-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  margin-bottom:18px;
}

.list-header h2{
  margin:0;
  font-size:20px;
}

.add-button{
  border:0;
  border-radius:22px;
  background:#e92332;
  color:#fff;
  font-weight:bold;
  padding:10px 16px;
  white-space:nowrap;
  cursor:pointer;
}


/* カード */

.card{
  border:1px solid #e0e8ef;
  border-radius:15px;
  padding:14px;
  margin:10px 0;
  box-shadow:0 2px 8px #102b4e0b;
}

.head{
  display:flex;
  justify-content:space-between;
  gap:8px;
  font-weight:bold;
}

.muted{
  font-size:12px;
  color:#71859a;
}

.detail-title{
  font-size:18px;
  margin:8px 0;
}


/* フォーム */

.field{
  margin:12px 0;
}

.field label{
  display:block;
  font-size:12px;
  font-weight:bold;
  margin-bottom:6px;
}

.field input,
.field textarea,
.field select{
  width:100%;
  max-width:100%;
  min-width:0;
  border:1px solid #d7e2eb;
  border-radius:10px;
  padding:12px;
  background:#fbfdff;
  color:#102b4e;
  font-size:16px;
}


/* ボタン */

.primary{
  width:100%;
  border:0;
  border-radius:24px;
  background:#e92332;
  color:#fff;
  font-weight:bold;
  padding:14px;
  margin-top:12px;
  cursor:pointer;
}

.secondary{
  width:100%;
  border:1px solid #d5e0e9;
  border-radius:24px;
  background:#eef4f8;
  color:#244764;
  font-weight:bold;
  padding:13px;
  margin-top:8px;
  cursor:pointer;
}

.small{
  border:0;
  background:#edf3f7;
  color:#365773;
  border-radius:18px;
  padding:7px 12px;
  font-size:12px;
  cursor:pointer;
}

.status{
  font-size:12px;
  color:#e92332;
  min-height:20px;
  margin-top:8px;
}

.empty{
  text-align:center;
  color:#8a9aaa;
  padding:28px 10px;
  font-size:13px;
}


/* ピル */

.pill{
  display:inline-block;
  background:#edf3f7;
  border-radius:15px;
  padding:4px 8px;
  font-size:11px;
  margin:3px 3px 0 0;
}


/* 詳細 */

.section{
  font-weight:bold;
  margin:18px 0 8px;
}


/* 上部ナビゲーション */

.unified-nav{
  position:sticky;
  top:0;
  z-index:50;
  background:#0b223d;
  padding:9px 10px;
  box-shadow:0 2px 8px rgba(0,0,0,.12);
  overflow-x:auto;
  -webkit-overflow-scrolling:touch;
}

.unified-nav-inner{
  display:flex;
  gap:7px;
  min-width:max-content;
  max-width:520px;
  margin:0 auto;
}

.unified-nav a{
  display:block;
  text-decoration:none;
  white-space:nowrap;
  border:1px solid rgba(255,255,255,.35);
  border-radius:18px;
  padding:8px 12px;
  color:#fff;
  font-size:12px;
  font-weight:700;
  background:rgba(255,255,255,.08);
}

.unified-nav a.active{
  background:#e92332;
  border-color:#e92332;
}

@media(min-width:700px){

  .unified-nav-inner{
    max-width:900px;
    justify-content:center;
  }

  .unified-nav a{
    font-size:13px;
    padding:9px 14px;
  }

}


/* 共通フッター */

.common-footer{
  display:flex;
  gap:8px;
  padding:10px 16px 18px;
  border-top:1px solid #e7edf2;
  background:#fff;
}

.common-footer a{
  flex:1;
  text-align:center;
  text-decoration:none;
  color:#71839b;
  font-size:11px;
  padding:7px 2px;
  border-radius:12px;
}

.common-footer a.active{
  color:#e92332;
  font-weight:800;
}

.common-footer .footer-icon{
  display:block;
  width:28px;
  height:28px;
  margin:0 auto 4px;
  object-fit:contain;
}


</style>

</head>


<body>


<!-- 上部ナビゲーション -->

<nav
  class="unified-nav"
  aria-label="記録メニュー"
>

  <div class="unified-nav-inner">

    <a href="../試合記録/index.html">
      試合記録
    </a>

    <a href="../成長記録/index.html">
      成長記録
    </a>

    <a href="../練習記録/index.html">
      練習記録
    </a>

    <a
      href="../ケガ・コンディション/index.html"
      class="active"
    >
      ケガ・コンディション
    </a>

    <a href="../野球用品/index.html">
      野球用品
    </a>

    <a href="../写真・思い出/index.html">
      写真・思い出
    </a>

  </div>

</nav>


<div class="app">


<header class="top">

  <h1>
    ケガ・コンディションを記録する
  </h1>

  <p>
    変化や治療・復帰までを記録
  </p>

</header>


<!-- =========================
     一覧画面
========================= -->

<section
  id="list-screen"
  class="screen active"
>


  <div class="list-header">

    <h2>
      ケガ・コンディション
    </h2>

    <button
      class="add-button"
      onclick="openForm()"
    >
      ＋ 追加
    </button>

  </div>


  <div id="record-list">

    <div class="empty">
      読み込み中…
    </div>

  </div>


</section>



<!-- =========================
     入力フォーム
========================= -->

<section
  id="form-screen"
  class="screen"
>


  <button
    class="small"
    onclick="show('list-screen')"
  >
    ← 戻る
  </button>


  <h2 id="form-title">
    ケガ・コンディションを記録する
  </h2>


  <form
    id="record-form"
    onsubmit="saveRecord(event)"
  >

    <!-- 日付 -->

<div class="field">

  <label>
    発生日
  </label>

  <input
    type="date"
    id="onset-date"
    required
  >

</div>


<div class="field">

  <label>
    完治日
  </label>

  <input
    type="date"
    id="recovery-date"
  >

</div>


    <!-- ケガ・コンディション -->

    <div class="field">

      <label>
        ケガ・コンディションの名前
      </label>

      <input
        id="condition-name"
        required
        placeholder="例：オスグッド・右足首の捻挫"
      >

    </div>


    <!-- メモ -->

    <div class="field">

      <label>
        メモ
      </label>

      <textarea
        id="memo"
        rows="4"
        placeholder="症状やきっかけ、診察内容など"
      ></textarea>

    </div>


    <!-- 治療・ケアの詳細のみ残す -->

    <div class="field">

      <label>
        治療・ケアの詳細
      </label>

      <textarea
        id="care-detail"
        rows="3"
        placeholder="通院回数や具体的な治療内容など"
      ></textarea>

    </div>


    <!-- 復帰 -->

    <div class="field">

      <label>
        復帰の時期・状況
      </label>

      <input
        id="return-status"
        placeholder="例：8/23 ピッチャーで復帰"
      >

    </div>


    <div
      id="form-status"
      class="status"
    ></div>


    <button
      class="primary"
      id="save-button"
    >
      保存する
    </button>


  </form>


</section>



<!-- =========================
     詳細画面
========================= -->

<section
  id="detail-screen"
  class="screen"
>


  <button
    class="small"
    onclick="show('list-screen')"
  >
    ← 一覧へ戻る
  </button>


  <div id="detail-content"></div>


</section>


</div>


<!-- =========================
     共通フッター
========================= -->

<nav
  class="common-footer"
  aria-label="下部メニュー"
>


  <a href="../試合記録/index.html">

    <img
      class="footer-icon"
      src="../icons/試合.png"
      alt="試合"
    >

    試合

  </a>


  <a
    href="../index.html"
    class="active"
  >

    <img
      class="footer-icon"
      src="../icons/ホーム.png"
      alt="ホーム"
    >

    ホーム

  </a>


  <a href="../record-menu.html">

    <img
      class="footer-icon"
      src="../icons/その他.png"
      alt="その他"
    >

    その他

  </a>


</nav>



<script>


const $ = id =>
  document.getElementById(id);


let editingId = null;


const client =
  window.supabaseClient ||
  (
    typeof supabaseClient !== 'undefined'
      ? supabaseClient
      : null
  );



/* 画面切り替え */

function show(id){

  document
    .querySelectorAll('.screen')
    .forEach(x =>
      x.classList.remove('active')
    );

  $(id).classList.add('active');

  window.scrollTo(0,0);

}



/* HTMLエスケープ */

function esc(s){

  return String(s ?? '')
    .replace(
      /[&<>'"]/g,
      c => ({
        '&':'&amp;',
        '<':'&lt;',
        '>':'&gt;',
        "'":'&#39;',
        '"':'&quot;'
      }[c])
    );

}



/* 新規入力フォーム */

function openForm(id = null){

  editingId = id;

  $('record-form').reset();

  $('onset-date').value =
    new Date()
      .toISOString()
      .slice(0,10);

  $('form-title').textContent =
    id
      ? 'ケガ・コンディションを編集'
      : 'ケガ・コンディションを記録する';

  $('form-status').textContent = '';

  if(id){

    loadForEdit(id);

  }else{

    show('form-screen');

  }

}



/* 編集データ読み込み */

async function loadForEdit(id){

  if(!client){

    return;

  }


  const r =
    await client
      .from('injury_conditions')
      .select('*')
      .eq('id',id)
      .single();


  if(r.error){

    alert(r.error.message);

    return;

  }


  const x = r.data;


  $('onset-date').value =
    x.onset_date || '';


  $('recovery-date').value =
    x.recovery_date || '';


  $('condition-name').value =
    x.condition_name || '';


  $('memo').value =
    x.memo || '';


  $('care-detail').value =
    x.care_detail || '';


  $('return-status').value =
    x.return_status || '';


  show('form-screen');

}



/* 一覧読み込み */

async function loadRecords(){

  if(!client){

    $('record-list').innerHTML =
      '<div class="empty">Supabaseとの接続設定が読み込まれていません。</div>';

    return;

  }


  const r =
    await client
      .from('injury_conditions')
      .select('*')
      .order(
        'onset_date',
        {
          ascending:false
        }
      )
      .order(
        'id',
        {
          ascending:false
        }
      );


  if(r.error){

    $('record-list').innerHTML =
      '<div class="empty">テーブル未設定：'
      + esc(r.error.message)
      + '</div>';

    return;

  }


  $('record-list').innerHTML =
    r.data.length

      ? r.data
          .map(
            x => `

              <div
                class="card"
                onclick="showDetail(${x.id})"
              >

                <div class="head">

                  <span>
                    ${esc(x.onset_date)}
                    〜
                    ${
                      x.recovery_date
                        ? esc(x.recovery_date)
                        : '現在'
                    }
                  </span>

                </div>


                <div class="detail-title">

                  ${esc(x.condition_name)}

                </div>


                <div class="muted">

                  ${esc(x.memo || '')}

                </div>

              </div>

            `
          )
          .join('')

      : '<div class="empty">まだ記録がありません。</div>';

}



/* 詳細表示 */

async function showDetail(id){

  const r =
    await client
      .from('injury_conditions')
      .select('*')
      .eq('id',id)
      .single();


  if(r.error){

    alert(r.error.message);

    return;

  }


  const x = r.data;


  $('detail-content').innerHTML = `

    <div class="head">

      <span>
        ケガ・コンディション詳細
      </span>

      <button
        class="small"
        onclick="openForm(${x.id})"
      >
        編集
      </button>

    </div>


    <div class="card">


      <div class="detail-title">

        ${esc(x.condition_name)}

      </div>


      <div class="muted">

        発生日：
        ${esc(x.onset_date)}

       　
        
        完治日：
        ${esc(x.recovery_date || '未入力')}

      </div>


      <div class="section">
        メモ
      </div>

      <div>
        ${esc(x.memo || '未入力')}
      </div>


      <div class="section">
        治療・ケアの詳細
      </div>

      <div>
        ${esc(x.care_detail || '未入力')}
      </div>


      <div class="section">
        復帰の時期・状況
      </div>

      <div>
        ${esc(x.return_status || '未入力')}
      </div>


    </div>


    <button
      class="primary"
      onclick="removeRecord(${x.id})"
    >
      削除する
    </button>

  `;


  show('detail-screen');

}



/* 保存 */

async function saveRecord(e){

  e.preventDefault();


  const status =
    $('form-status');

  const btn =
    $('save-button');


  status.textContent =
    '保存中…';

  btn.disabled = true;


  try{


    if(!client){

      throw new Error(
        'Supabaseとの接続設定が読み込まれていません。supabase-config.jsを確認してください。'
      );

    }


    /*
      完治日が入力されていれば「完治」、
      入力されていなければ「継続中」として
      is_ongoingを自動設定する。
    */

    const recoveryDate =
      $('recovery-date').value || null;


    const data = {

      onset_date:
        $('onset-date').value,

      recovery_date:
        recoveryDate,

      is_ongoing:
        !recoveryDate,

      condition_name:
        $('condition-name')
          .value
          .trim(),

      memo:
        $('memo')
          .value
          .trim() || null,

      /*
        care_typesは今回フォームから
        選択欄を削除したため、
        新規保存・更新では変更しない。
      */

      care_detail:
        $('care-detail')
          .value
          .trim() || null,

      return_status:
        $('return-status')
          .value
          .trim() || null

    };


    let r;


    if(editingId){

      r =
        await client
          .from('injury_conditions')
          .update(data)
          .eq('id',editingId);

    }else{

      r =
        await client
          .from('injury_conditions')
          .insert(data);

    }


    if(r.error){

      throw new Error(
        r.error.message
      );

    }


    show('list-screen');

    await loadRecords();


  }catch(err){

    console.error(err);

    status.textContent =
      '保存できませんでした：'
      + err.message;


  }finally{

    btn.disabled = false;

  }

}



/* 削除 */

async function removeRecord(id){

  if(
    !confirm(
      'この記録を削除しますか？'
    )
  ){

    return;

  }


  const r =
    await client
      .from('injury_conditions')
      .delete()
      .eq('id',id);


  if(r.error){

    alert(r.error.message);

    return;

  }


  show('list-screen');

  loadRecords();

}



/* 初期読み込み */

loadRecords();


</script>

</body>

</html>

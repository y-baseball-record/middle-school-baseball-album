<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>練習記録</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><style>
*{box-sizing:border-box}body{margin:0;background:#eef3f6;color:#102b4e;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif}.app{max-width:520px;margin:auto;min-height:100vh;background:#fff}.top{background:#102b4e;color:#fff;padding:20px}.top h1{font-size:23px;margin:0 0 6px}.top p{margin:0;font-size:12px;opacity:.85}.screen{display:none;padding:18px}.screen.active{display:block}.back{border:0;background:none;color:#fff;font-size:16px;padding:0 0 12px}.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-bottom:18px}.tabs button,.grade button{border:0;border-radius:10px;padding:11px 4px;background:transparent;color:#728096;font-weight:700;font-size:16px}.tabs button.active,.grade button.active{background:#e92332;color:#fff}.grade{display:flex;gap:8px;background:#eaf0f5;padding:5px;border-radius:14px;margin-bottom:15px}.grade button{flex:1}.year{font-size:17px;font-weight:bold;margin:15px 0 8px}.card{border:1px solid #dfe8ef;border-radius:15px;padding:13px;margin:9px 0;box-shadow:0 2px 8px #102b4e0c}.head{display:flex;justify-content:space-between;gap:8px;font-weight:bold}.muted{font-size:12px;color:#71859a;line-height:1.6}.type{display:inline-block;background:#e8f6f1;color:#16866b;border-radius:12px;padding:3px 7px;font-size:11px;margin:3px 3px 0 0}.field{margin:13px 0}.field label{display:block;font-size:12px;font-weight:bold;margin-bottom:6px}.field input,.field textarea,.field select{width:100%;border:1px solid #d5e2eb;border-radius:10px;padding:12px;background:#fbfdff;color:#102b4e;font:inherit}.checks{display:grid;grid-template-columns:1fr 1fr;gap:8px}.checks label{border:1px solid #dce7ee;border-radius:10px;padding:11px;font-size:13px}.checks input{accent-color:#e92332;margin-right:6px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.primary{width:100%;border:0;border-radius:25px;background:#e92332;color:#fff;font-weight:bold;padding:15px;margin-top:10px}.secondary{width:100%;border:1px solid #d7e3eb;border-radius:25px;background:#eef4f8;color:#244764;font-weight:bold;padding:13px;margin-top:8px}.small{border:0;border-radius:18px;background:#edf3f7;color:#365773;padding:7px 11px;font-size:12px}.danger{border:1px solid #e92332;background:white;color:#e92332}.status{color:#e92332;font-size:12px;min-height:18px;margin-top:8px}.empty{text-align:center;color:#8a9aaa;padding:28px 10px;font-size:13px}.bottom{display:flex;gap:8px;padding:12px 18px 18px;border-top:1px solid #e7edf2}.bottom button{flex:1;border:0;background:white;color:#526d86;font-size:11px}.bottom button.active{color:#e92332;font-weight:bold}.filter{display:flex;justify-content:center;gap:8px;margin-bottom:12px}.filter input,.filter select{width:100%;max-width:420px;padding:12px;border:1px solid #d5e2eb;border-radius:10px;background:white;font-size:16px}
</style>
<style id="unified-navigation-style">
.unified-nav{position:sticky;top:0;z-index:50;background:#0b223d;padding:9px 10px;box-shadow:0 2px 8px rgba(0,0,0,.12);overflow-x:auto;-webkit-overflow-scrolling:touch}
.unified-nav-inner{display:flex;gap:7px;min-width:max-content;max-width:520px;margin:0 auto}
.unified-nav a{display:block;text-decoration:none;white-space:nowrap;border:1px solid rgba(255,255,255,.35);border-radius:18px;padding:8px 12px;color:#fff;font-size:12px;font-weight:700;background:rgba(255,255,255,.08)}
.unified-nav a.active{background:#e92332;border-color:#e92332}
@media(min-width:700px){.unified-nav-inner{max-width:900px;justify-content:center}.unified-nav a{font-size:13px;padding:9px 14px}}
</style>

<style id="common-footer-style">
.common-footer{display:flex;gap:8px;padding:12px 18px 18px;border-top:1px solid #e7edf2;background:#fff}
.common-footer a{flex:1;text-align:center;text-decoration:none;color:#526d86;font-size:11px;padding:7px 2px;border-radius:12px}
.common-footer a .footer-icon{display:block;font-size:22px;line-height:1.2;margin-bottom:4px}
.common-footer a.active{color:#e92332;font-weight:800}
</style>

</head><body>
<nav class="unified-nav" aria-label="記録メニュー"><div class="unified-nav-inner"><a href="../試合記録/index.html">試合記録</a><a href="../成長記録/index.html">成長記録</a><a href="../練習記録/index.html" class="active">練習記録</a><a href="../ケガ・コンディション/index.html">ケガ・コンディション</a><a href="../野球用品/index.html">野球用品</a><a href="../写真・思い出/index.html">写真・思い出</a></div></nav>
<div class="app"><header class="top"><h1>練習を記録する</h1><p>練習内容・変化を無理なく記録</p></header>
<section id="list-screen" class="screen active"><div class="grade"><button class="active" data-grade="all">すべて</button><button data-grade="中1">中1</button><button data-grade="中2">中2</button><button data-grade="中3">中3</button></div><div class="filter"><input id="type-filter" placeholder="練習内容で検索"></div><div id="list"><div class="empty">読み込み中…</div></div><button class="primary" onclick="openForm()">＋ 練習を追加</button></section>
<section id="form-screen" class="screen"><button class="small" onclick="show('list-screen')">← 戻る</button><h2 id="form-title">練習を記録する</h2><form id="form" onsubmit="save(event)"><div class="field"><label>日付</label><input type="date" id="date" required></div><div class="field"><label>練習メニュー（複数選択可）</label><div class="checks"><label><input type="checkbox" value="素振り">素振り</label><label><input type="checkbox" value="シャトル打ち">シャトル打ち</label><label><input type="checkbox" value="置きティー">置きティー</label><label><input type="checkbox" value="Amazing">Amazing</label><label><input type="checkbox" value="北ベース">北ベース</label><label><input type="checkbox" value="その他">その他</label></div></div><div class="field"><label>その他の内容</label><input id="other" placeholder="ランニング、筋トレなど"></div><div class="grid2"><div class="field"><label>練習時間（分）</label><input type="number" id="duration" min="0" step="1"></div><div class="field"><label>場所</label><select id="location"><option value="">選択してください</option><option>自宅</option><option>グラウンド</option><option>公園</option><option>室内</option><option>その他</option></select></div></div><div class="field"><label>メモ</label><textarea id="note" rows="4" placeholder="父とシャトルを投げて練習。"></textarea></div><div id="status" class="status"></div><button class="primary">保存する</button></form></section>
<section id="detail-screen" class="screen"><button class="small" onclick="show('list-screen')">← 戻る</button><h2>練習の詳細</h2><div id="detail"></div></section>
</div>
<script>const $=id=>document.getElementById(id);const client = (typeof supabaseClient !== 'undefined') ? supabaseClient : window.supabaseClient;let records=[],grade='all',editing=null;function show(id){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));$(id).classList.add('active');scrollTo(0,0)}function fmtTypes(a){return (a||[]).map(x=>'<span class="type">'+esc(x)+'</span>').join('')}function esc(s){return String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}function gradeOf(d){const y=Number(d.slice(0,4));return y===2026?'中1':y===2027?'中2':y===2028?'中3':''}function filtered(){const t=$('type-filter').value.trim().toLowerCase();return records.filter(r=>(grade==='all'||gradeOf(r.practice_date)===grade)&&(!t||(r.practice_types||[]).join(' ').toLowerCase().includes(t)||(r.other_detail||'').toLowerCase().includes(t)))}function render(){const fs=filtered();if(!fs.length){$('list').innerHTML='<div class="empty">該当する練習記録がありません。</div>';return}let html='',last='';fs.forEach(r=>{const y=r.practice_date.slice(0,4);if(y!==last){html+='<div class="year">'+y+'年</div>';last=y}html+='<div class="card"><div class="head"><span>● '+r.practice_date+'</span><button class="small" onclick="detail('+r.id+')">›</button></div><div>'+fmtTypes(r.practice_types)+'</div><div class="muted">'+(r.duration_minutes?r.duration_minutes+'分　':'')+(esc(r.location||''))+'</div><div class="muted">'+esc(r.note||'')+'</div></div>'});$('list').innerHTML=html}async function load(){if(!client){$('list').innerHTML='<div class="empty">Supabase接続設定を確認してください。</div>';return}const r=await client.from('practice_records').select('*').order('practice_date',{ascending:false}).order('id',{ascending:false});if(r.error){$('list').innerHTML='<div class="empty">テーブル未設定：'+esc(r.error.message)+'</div>';return}records=r.data||[];render()}function openForm(r=null){editing=r?r.id:null;$('form').reset();$('date').value=r?r.practice_date:new Date().toISOString().slice(0,10);$('form-title').textContent=r?'練習を編集する':'練習を記録する';(r?.practice_types||[]).forEach(v=>{const el=[...document.querySelectorAll('.checks input')].find(x=>x.value===v);if(el)el.checked=true});$('other').value=r?.other_detail||'';$('duration').value=r?.duration_minutes??'';$('location').value=r?.location||'';$('note').value=r?.note||'';$('status').textContent='';show('form-screen')}async function save(e){e.preventDefault();const st=$('status');st.textContent='保存中…';const types=[...document.querySelectorAll('.checks input:checked')].map(x=>x.value);const data={practice_date:$('date').value,practice_types:types,other_detail:$('other').value.trim()||null,duration_minutes:$('duration').value===''?null:Number($('duration').value),location:$('location').value||null,note:$('note').value.trim()||null};try{if(!client)throw Error('Supabase接続設定が読み込まれていません。');const q=editing?client.from('practice_records').update(data).eq('id',editing):client.from('practice_records').insert(data);const r=await q;if(r.error)throw Error(r.error.message);await load();show('list-screen')}catch(err){st.textContent='保存できませんでした：'+err.message}}async function detail(id){const r=records.find(x=>x.id===id);if(!r)return;$('detail').innerHTML='<div class="card"><div class="head"><span>'+r.practice_date+'</span><span class="muted">'+(r.duration_minutes?r.duration_minutes+'分':'')+'</span></div><p>'+fmtTypes(r.practice_types)+'</p><p><b>その他：</b>'+esc(r.other_detail||'なし')+'</p><p><b>場所：</b>'+esc(r.location||'未入力')+'</p><p><b>メモ：</b><br>'+esc(r.note||'なし')+'</p><button class="primary" onclick="openForm(records.find(x=>x.id==='+id+'))">編集する</button><button class="secondary danger" onclick="removeRecord('+id+')">削除する</button></div>';show('detail-screen')}async function removeRecord(id){if(!confirm('この練習記録を削除しますか？'))return;const r=await client.from('practice_records').delete().eq('id',id);if(r.error){alert(r.error.message);return}await load();show('list-screen')}document.querySelectorAll('[data-grade]').forEach(b=>b.onclick=()=>{grade=b.dataset.grade;document.querySelectorAll('[data-grade]').forEach(x=>x.classList.toggle('active',x===b));render()});$('type-filter').oninput=render;load();</script><nav class="common-footer" aria-label="下部メニュー"><a href="../試合記録/index.html" class=""><span class="footer-icon">⚾</span>試合</a><a href="../index.html" class=""><span class="footer-icon">⌂</span>ホーム</a><a href="../record-menu.html" class="active"><span class="footer-icon">☰</span>その他</a></nav>
</body></html>

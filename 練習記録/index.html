<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>練習記録</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><style>
*{box-sizing:border-box}body{margin:0;background:#eef3f6;color:#102b4e;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif}.app{max-width:520px;margin:auto;min-height:100vh;background:#fff}.top{background:#102b4e;color:#fff;padding:20px}.top h1{font-size:23px;margin:0 0 6px}.top p{margin:0;font-size:12px;opacity:.85}.screen{display:none;padding:18px}.screen.active{display:block}.back{border:0;background:none;color:#fff;font-size:16px;padding:0 0 12px}.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-bottom:18px}.tabs button,.grade button{border:0;border-radius:10px;padding:11px 4px;background:transparent;color:#728096;font-weight:700;font-size:16px}.tabs button.active,.grade button.active{background:#e92332;color:#fff}.grade{display:flex;gap:8px;background:#eaf0f5;padding:5px;border-radius:14px;margin-bottom:15px}.grade button{flex:1}.year{font-size:17px;font-weight:bold;margin:15px 0 8px}.card{border:1px solid #dfe8ef;border-radius:15px;padding:13px;margin:9px 0;box-shadow:0 2px 8px #102b4e0c}.head{display:flex;justify-content:space-between;gap:8px;font-weight:bold}.muted{font-size:12px;color:#71859a;line-height:1.6}.type{display:inline-block;background:#e8f6f1;color:#16866b;border-radius:14px;padding:5px 9px;font-size:13px;margin:3px 3px 0 0}.field{margin:13px 0}.field label{display:block;font-size:12px;font-weight:bold;margin-bottom:6px}.field input,.field textarea,.field select{box-sizing:border-box;width:100%;min-width:0;max-width:100%;border:1px solid #d5e2eb;border-radius:10px;padding:12px;background:#fbfdff;color:#102b4e;font:inherit}.field input[type="date"]{min-width:0;width:100%;max-width:100%;-webkit-appearance:none;appearance:none}.checks{display:grid;grid-template-columns:1fr 1fr;gap:8px}.checks label{border:1px solid #dce7ee;border-radius:10px;padding:11px;font-size:13px}.checks input{accent-color:#e92332;margin-right:6px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.primary{width:100%;border:0;border-radius:25px;background:#e92332;color:#fff;font-weight:bold;padding:15px;margin-top:10px}.secondary{width:100%;border:1px solid #d7e3eb;border-radius:25px;background:#eef4f8;color:#244764;font-weight:bold;padding:13px;margin-top:8px}.small{border:0;border-radius:18px;background:#edf3f7;color:#365773;padding:7px 11px;font-size:12px}.danger{border:1px solid #e92332;background:white;color:#e92332}.status{color:#e92332;font-size:12px;min-height:18px;margin-top:8px}.empty{text-align:center;color:#8a9aaa;padding:28px 10px;font-size:13px}.bottom{display:flex;gap:8px;padding:12px 18px 18px;border-top:1px solid #e7edf2}.bottom button{flex:1;border:0;background:white;color:#526d86;font-size:11px}.bottom button.active{color:#e92332;font-weight:bold}.filter{display:flex;justify-content:center;gap:8px;margin-bottom:12px}.filter input,.filter select{width:100%;max-width:420px;padding:12px;border:1px solid #d5e2eb;border-radius:10px;background:white;font-size:16px}.filter-add{display:flex;gap:8px;align-items:center;margin-bottom:15px}.filter-add .filter{flex:1;margin:0}.filter-add .filter input{max-width:none}.add-small{flex:0 0 auto;width:auto;min-width:60px;margin:0;padding:12px 14px;border-radius:12px}.practice-card{display:grid;grid-template-columns:1fr;gap:10px;position:relative}.practice-main{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:14px;align-items:start}.practice-menu-area{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-start;min-width:0}.practice-menu-item{width:96px;text-align:center;font-size:13px;font-weight:700;line-height:1.3}.practice-menu-item img{display:block;width:88px;height:88px;object-fit:contain;margin:0 auto 5px}.practice-details{min-width:0;font-size:14px;line-height:1.55;display:flex;flex-direction:column;gap:3px;padding-top:2px}.practice-detail-item{overflow-wrap:anywhere}.record-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:0}.record-actions button{width:30px;height:30px;padding:2px;border:0;background:transparent}.record-actions img{display:block;width:26px;height:26px;object-fit:contain;margin:auto}@media(max-width:380px){.practice-main{grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:10px}.practice-menu-area{gap:6px}.practice-menu-item{width:82px;font-size:12px}.practice-menu-item img{width:76px;height:76px}.practice-details{font-size:13px}}
</style>
<style id="unified-navigation-style">
.unified-nav{position:sticky;top:0;z-index:50;background:#0b223d;padding:9px 10px;box-shadow:0 2px 8px rgba(0,0,0,.12);overflow-x:auto;-webkit-overflow-scrolling:touch}
.unified-nav-inner{display:flex;gap:7px;min-width:max-content;max-width:520px;margin:0 auto}
.unified-nav a{display:block;text-decoration:none;white-space:nowrap;border:1px solid rgba(255,255,255,.35);border-radius:18px;padding:8px 12px;color:#fff;font-size:12px;font-weight:700;background:rgba(255,255,255,.08)}
.unified-nav a.active{background:#e92332;border-color:#e92332}
@media(min-width:700px){.unified-nav-inner{max-width:900px;justify-content:center}.unified-nav a{font-size:13px;padding:9px 14px}}
</style>

<style id="common-footer-style">
.common-footer{display:flex;gap:8px;padding:12px 18px 18px;border-top:1px solid #e7edf2;background:#fff}
.common-footer a{flex:1;text-align:center;text-decoration:none;color:#526d86;font-size:11px;padding:7px 2px;border-radius:12px}
.common-footer a .footer-icon{display:block;width:28px;height:28px;object-fit:contain;margin:0 auto 4px}
.common-footer a.active{color:#e92332;font-weight:800}
</style>


<style id="app-color-targeted">
/* 色変更：試合記録に合わせる */
header.top{background:#221f1e!important;color:#fff!important;}
.grade button.active{background:#dcfa79!important;color:#221f1e!important;}
.filter-add > .primary.add-small{background:#dcfa79!important;color:#221f1e!important;}
</style>

<style id="nav-color-override">
/* 共通上部ナビ：試合記録と同じ配色 */
.unified-nav { background:#221f1e !important; }
.unified-nav a.active { background:#dcfa79 !important; border-color:#dcfa79 !important; color:#221f1e !important; }
</style>

<style id="form-save-color">
#form button.primary { background:#dcfa79 !important; color:#221f1e !important; }
</style>
</head><body>
<nav class="unified-nav" aria-label="記録メニュー"><div class="unified-nav-inner"><a href="../試合記録/index.html">試合記録</a><a href="../成長記録/index.html">成長記録</a><a href="../練習記録/index.html" class="active">練習記録</a><a href="../ケガ・コンディション/index.html">ケガ・コンディション</a><a href="../野球用品/index.html">野球用品</a><a href="../写真・思い出/index.html">写真・思い出</a></div></nav>
<div class="app"><header class="top"><h1>練習を記録する</h1><p>練習内容・変化を無理なく記録</p></header>
<section id="list-screen" class="screen active"><div class="grade"><button class="active" data-grade="all">すべて</button><button data-grade="中1">中1</button><button data-grade="中2">中2</button><button data-grade="中3">中3</button></div><div class="filter-add"><div class="filter"><input id="type-filter" placeholder="練習内容で検索"></div><button class="primary add-small" onclick="openForm()">＋追加</button></div><div id="list"><div class="empty">読み込み中…</div></div></section>
<section id="form-screen" class="screen"><button class="small" onclick="show('list-screen')">← 戻る</button><h2 id="form-title">練習を記録する</h2><form id="form" onsubmit="save(event)"><div class="field"><label>日付</label><input type="date" id="date" required></div><div class="field"><label>練習メニュー（複数選択可）</label><div class="checks"><label><input type="checkbox" value="北">北</label><label><input type="checkbox" value="Amazing">Amazing</label><label><input type="checkbox" value="素振り">素振り</label><label><input type="checkbox" value="家トレ">家トレ</label><label><input type="checkbox" value="プール">プール</label><label><input type="checkbox" value="朝練">朝練</label><label><input type="checkbox" value="その他">その他</label></div></div><div class="field"><label>その他の内容</label><input id="other" placeholder="ランニング、筋トレなど"></div><div class="grid2"><div class="field"><label>練習時間（分）</label><input type="number" id="duration" min="0" step="1"></div><div class="field"><label>場所</label><select id="location"><option value="">選択してください</option><option>河川敷</option><option>HiroshimaBase</option><option>公園</option><option>家</option><option>宇品</option><option>吉島プール</option><option>その他</option></select></div></div><div class="field"><label>メモ</label><textarea id="note" rows="4" placeholder="父とシャトルを投げて練習。"></textarea></div><div id="status" class="status"></div><button class="primary">保存する</button></form></section>

</div>
<script>const $=id=>document.getElementById(id);const client = (typeof supabaseClient !== 'undefined') ? supabaseClient : window.supabaseClient;let records=[],grade='all',editing=null;function show(id){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));$(id).classList.add('active');scrollTo(0,0)}function fmtTypes(a){return (a||[]).map(x=>'<span class="type">'+esc(x)+'</span>').join('')}function esc(s){return String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}function gradeOf(d){const y=Number(d.slice(0,4));return y===2026?'中1':y===2027?'中2':y===2028?'中3':''}function filtered(){const t=$('type-filter').value.trim().toLowerCase();return records.filter(r=>(grade==='all'||gradeOf(r.practice_date)===grade)&&(!t||(r.practice_types||[]).join(' ').toLowerCase().includes(t)||(r.other_detail||'').toLowerCase().includes(t)))}function iconForType(type){const map={'北':'../icons/北.png','Amazing':'../icons/Amazing.png','素振り':'../icons/素振り.png','家トレ':'../icons/家トレ.png','プール':'../icons/プール.png','朝練':'../icons/朝練.png','その他':'../icons/その他練習.png'};return map[type]||'../icons/その他練習.png'}function render(){const fs=filtered();if(!fs.length){$('list').innerHTML='<div class="empty">該当する練習記録がありません。</div>';return}let html='';fs.forEach(r=>{const types=r.practice_types||[];const menuHtml=types.map(type=>'<div class="practice-menu-item"><img src="'+iconForType(type)+'" alt="'+esc(type)+'"><span>'+esc(type)+'</span></div>').join('');const details=[];if(r.practice_date)details.push('<div class="practice-detail-item">'+esc(r.practice_date)+'</div>');if(r.duration_minutes!=null)details.push('<div class="practice-detail-item">'+esc(r.duration_minutes)+'分</div>');if(r.location)details.push('<div class="practice-detail-item">'+esc(r.location)+'</div>');if(r.other_detail)details.push('<div class="practice-detail-item">'+esc(r.other_detail)+'</div>');if(r.note)details.push('<div class="practice-detail-item">'+esc(r.note)+'</div>');html+='<div class="card practice-card"><div class="practice-main"><div class="practice-menu-area">'+menuHtml+'</div><div class="practice-details">'+details.join('')+'</div></div><div class="record-actions"><button onclick="openForm(records.find(x=>x.id==='+r.id+'))" aria-label="編集"><img src="../icons/編集.png" alt=""></button><button onclick="removeRecord('+r.id+')" aria-label="削除"><img src="../icons/削除.png" alt=""></button></div></div>'});$('list').innerHTML=html}async function load(){if(!client){$('list').innerHTML='<div class="empty">Supabase接続設定を確認してください。</div>';return}const r=await client.from('practice_records').select('*').order('practice_date',{ascending:false}).order('id',{ascending:false});if(r.error){$('list').innerHTML='<div class="empty">テーブル未設定：'+esc(r.error.message)+'</div>';return}records=r.data||[];render()}function openForm(r=null){editing=r?r.id:null;$('form').reset();$('date').value=r?r.practice_date:new Date().toISOString().slice(0,10);$('form-title').textContent=r?'練習を編集する':'練習を記録する';(r?.practice_types||[]).forEach(v=>{const el=[...document.querySelectorAll('.checks input')].find(x=>x.value===v);if(el)el.checked=true});$('other').value=r?.other_detail||'';$('duration').value=r?.duration_minutes??'';$('location').value=r?.location||'';$('note').value=r?.note||'';$('status').textContent='';show('form-screen')}async function save(e){e.preventDefault();const st=$('status');st.textContent='保存中…';const types=[...document.querySelectorAll('.checks input:checked')].map(x=>x.value);const data={practice_date:$('date').value,practice_types:types,other_detail:$('other').value.trim()||null,duration_minutes:$('duration').value===''?null:Number($('duration').value),location:$('location').value||null,note:$('note').value.trim()||null};try{if(!client)throw Error('Supabase接続設定が読み込まれていません。');const q=editing?client.from('practice_records').update(data).eq('id',editing):client.from('practice_records').insert(data);const r=await q;if(r.error)throw Error(r.error.message);editing=null;await load();show('list-screen')}catch(err){st.textContent='保存できませんでした：'+err.message}}async function removeRecord(id){if(!confirm('この練習記録を削除しますか？'))return;const r=await client.from('practice_records').delete().eq('id',id);if(r.error){alert(r.error.message);return}await load();show('list-screen')}document.querySelectorAll('[data-grade]').forEach(b=>b.onclick=()=>{grade=b.dataset.grade;document.querySelectorAll('[data-grade]').forEach(x=>x.classList.toggle('active',x===b));render()});$('type-filter').oninput=render;load();</script><nav class="common-footer" aria-label="下部メニュー"><a href="../試合記録/index.html" class=""><img class="footer-icon" src="../icons/試合.png" alt="">試合</a><a href="../index.html" class=""><img class="footer-icon" src="../icons/ホーム.png" alt="">ホーム</a><a href="../record-menu.html" class="active"><img class="footer-icon" src="../icons/その他.png" alt="">その他</a></nav>
</body></html>

<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>中学野球日記｜試合記録</title>
<style>
:root{--red:#e52b35;--navy:#102b4c;--bg:#f4f7fa;--line:#dfe7ef;--muted:#728096;--gold:#d7a52b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif;color:var(--navy)}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0}.app{max-width:520px;margin:auto;min-height:100vh;background:#fff}.top{background:#102b4e;color:#fff;padding:20px}.top small{opacity:.8}.top h1{font-size:22px;margin:0 0 5px}.top p{font-size:12px;margin:0;opacity:.85}.content{padding:16px}.screen{display:none}.screen.active{display:block}.section-title{display:flex;justify-content:space-between;align-items:center;margin:12px 0;font-weight:800}.muted{color:var(--muted);font-size:12px}.tabs,.grades{display:flex;gap:8px;background:#eaf0f5;padding:5px;border-radius:14px;margin-bottom:15px}.tabs button,.grades button{flex:1;padding:11px 4px;border-radius:10px;background:transparent;color:var(--muted);font-weight:700}.tabs button.active,.grades button.active{background:var(--red);color:#fff}.btn{border-radius:14px;padding:13px 16px;font-weight:800}.btn.primary{background:var(--red);color:#fff}.btn.outline{background:#fff;border:1px solid var(--red);color:var(--red)}.btn.light{background:#edf3f8;color:var(--navy)}.full{width:100%}.card{background:#fff;border:1px solid #e6edf3;border-radius:16px;padding:15px;margin-bottom:12px;box-shadow:0 3px 10px #17365d0b}.game-card{position:relative}.game-head{display:flex;justify-content:space-between;gap:8px}.date{font-weight:800}.badge{display:inline-block;background:#edf3f8;color:var(--navy);padding:4px 8px;border-radius:20px;font-size:11px}.opponent{font-size:16px;font-weight:800;margin:8px 0}.score{font-size:25px;font-weight:900;letter-spacing:1px}.result{font-weight:800;color:var(--red);margin-left:8px}.game-meta{font-size:12px;color:var(--muted);margin-top:8px}.actions{display:flex;gap:8px;margin-top:12px}.actions button{flex:1;padding:9px;border-radius:10px;font-size:12px;font-weight:700}.edit{background:#edf3f8;color:var(--navy)}.delete{background:#fff0f1;color:#c31e2a}.detail{margin-top:10px;border-top:1px solid var(--line);padding-top:10px}.detail summary{font-size:12px;font-weight:800;cursor:pointer}.filters{display:flex;justify-content:center;gap:8px;margin-bottom:12px}.filters input{width:100%;max-width:420px}.field{margin-bottom:13px}.field label{display:block;font-size:12px;font-weight:800;margin-bottom:6px}.field input,.field select,.field textarea{width:100%;padding:12px;border:1px solid var(--line);border-radius:11px;background:#fff;color:var(--navy)}.field textarea{min-height:80px;resize:vertical}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.grid .field{margin:0}.grid .field label{font-size:11px}.grid input{padding:11px 7px}.form-card{background:#fff;border-radius:18px;padding:15px;border:1px solid var(--line);margin-bottom:12px}.backrow{display:flex;align-items:center;gap:10px;margin-bottom:15px}.back{background:none;color:var(--navy);font-size:22px;padding:0}.backrow h2{font-size:19px;margin:0;flex:1}.save-top{background:var(--red);color:#fff;border-radius:9px;padding:8px 13px;font-size:12px;font-weight:800}.summary-box{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px;text-align:center;margin:20px 0}.check{width:58px;height:58px;background:#0d9488;color:#fff;border-radius:50%;display:grid;place-items:center;font-size:32px;margin:0 auto 15px}.empty{text-align:center;padding:30px 10px;color:var(--muted);font-size:13px}.status{font-size:12px;margin:8px 0;color:var(--muted)}.hidden{display:none!important}.nav{position:sticky;bottom:0;background:#fff;border-top:1px solid var(--line);padding:10px 16px;display:flex;gap:8px}.nav button{flex:1;background:#fff;color:var(--muted);font-size:11px;padding:7px}.nav button.active{color:var(--red);font-weight:800}.nav span{display:block;font-size:20px;margin-bottom:2px}.hero-btn{margin:8px 0 18px}.notice{background:#fff8e6;border:1px solid #f0d48a;border-radius:12px;padding:10px;font-size:12px;color:#775713}
</style>
<style id="unified-navigation-style">
.unified-nav{position:sticky;top:0;z-index:50;background:#0b223d;padding:9px 10px;box-shadow:0 2px 8px rgba(0,0,0,.12);overflow-x:auto;-webkit-overflow-scrolling:touch}
.unified-nav-inner{display:flex;gap:7px;min-width:max-content;max-width:520px;margin:0 auto}
.unified-nav a{display:block;text-decoration:none;white-space:nowrap;border:1px solid rgba(255,255,255,.35);border-radius:18px;padding:8px 12px;color:#fff;font-size:12px;font-weight:700;background:rgba(255,255,255,.08)}
.unified-nav a.active{background:#e92332;border-color:#e92332}
@media(min-width:700px){.unified-nav-inner{max-width:900px;justify-content:center}.unified-nav a{font-size:13px;padding:9px 14px}}
</style>

<style id="common-footer-style">
.common-footer{display:flex;gap:8px;padding:10px 16px 18px;border-top:1px solid #e7edf2;background:#fff}
.common-footer a{flex:1;text-align:center;text-decoration:none;color:#71839b;font-size:11px;padding:7px 2px;border-radius:12px}
.common-footer a .footer-icon{display:block;font-size:24px;line-height:1.2;margin-bottom:4px}
.common-footer a.active{color:#e92332;font-weight:800}
</style>
</head>
<body>
<nav class="unified-nav" aria-label="記録メニュー"><div class="unified-nav-inner"><a href="../試合記録/index.html" class="active">試合記録</a><a href="../成長記録/index.html">成長記録</a><a href="../練習記録/index.html">練習記録</a><a href="../ケガ・コンディション/index.html">ケガ・コンディション</a><a href="../野球用品/index.html">野球用品</a><a href="../写真・思い出/index.html">写真・思い出</a></div></nav>
<div class="app">
<header class="top"><h1>試合の記録</h1><p>3年間の試合・成績・思い出を残そう</p></header>
<main class="content">
<section id="list-screen" class="screen active">
<div class="section-title"><span>試合一覧</span><span class="muted" id="count-label"></span></div>
<div class="grades" id="grade-tabs"><button data-grade="all" class="active">すべて</button><button data-grade="1">中1</button><button data-grade="2">中2</button><button data-grade="3">中3</button></div>
<div class="filters">
<input id="opponent-filter" placeholder="対戦相手を検索">
</div>
<button class="btn primary full hero-btn" id="add-btn">＋ 試合を追加</button>
<div id="list-status" class="status">読み込み中…</div><div id="games-list"></div>
</section>
<section id="form-screen" class="screen">
<div class="backrow"><button class="back" id="form-back">‹</button><h2 id="form-title">試合の登録</h2><button class="save-top" id="save-btn">保存</button></div>
<form id="game-form">
<div class="form-card"><div class="section-title">試合基本情報</div>
<div class="field"><label>試合日 *</label><input type="date" id="game-date" required></div>
<div class="field"><label>大会名・試合名</label><input id="tournament-name" placeholder="例：○○大会"></div>
<div class="field"><label>試合の種類</label><select id="game-type"><option value="">選択してください</option><option>公式戦</option><option>練習試合</option><option>オープン戦</option><option>その他</option></select></div>
<div class="field"><label>対戦相手 *</label><input id="opponent" required placeholder="例：○○中"></div>
<div class="grid"><div class="field"><label>自チーム得点</label><input type="number" id="team-score" min="0"></div><div class="field"><label>相手得点</label><input type="number" id="opponent-score" min="0"></div><div class="field"><label>イニング数</label><input type="number" id="innings" min="1" value="7"></div></div>
<div class="field"><label>主な守備位置</label><select id="main-position"><option value="">選択してください</option><option>ピッチャー</option><option>キャッチャー</option><option>ファースト</option><option>セカンド</option><option>サード</option><option>ショート</option><option>レフト</option><option>センター</option><option>ライト</option><option>その他</option></select></div>
<div class="field"><label>試合メモ</label><textarea id="game-note" placeholder="試合の感想や印象に残ったこと"></textarea></div></div>
<div class="tabs" id="record-tabs"><button type="button" data-tab="batting" class="active">打撃</button><button type="button" data-tab="pitching">投手</button><button type="button" data-tab="fielding">守備</button></div>
<div id="batting-panel" class="form-card"><div class="section-title">打撃成績</div><div class="grid" id="batting-fields"></div><div class="field"><label>メモ</label><textarea id="batting-note"></textarea></div></div>
<div id="pitching-panel" class="form-card hidden"><div class="section-title">投手成績</div><div class="grid" id="pitching-fields"></div><div class="field"><label>防御率（自動計算）</label><input id="era-display" readonly placeholder="投球回と自責点から自動計算"></div><div class="field"><label>メモ</label><textarea id="pitching-note"></textarea></div></div>
<div id="fielding-panel" class="form-card hidden"><div class="section-title">守備記録</div><div class="field"><label>守備位置</label><select id="field-position"><option value="">選択してください</option><option>ピッチャー</option><option>キャッチャー</option><option>ファースト</option><option>セカンド</option><option>サード</option><option>ショート</option><option>レフト</option><option>センター</option><option>ライト</option><option>その他</option></select></div><div class="field"><label>エラー</label><select id="errors"><option value="0">なし</option><option value="1">あり</option></select></div><div class="field"><label>エラー内容</label><textarea id="error-note"></textarea></div><div class="field"><label>メモ</label><textarea id="fielding-note"></textarea></div></div>
<p id="form-status" class="status"></p><button type="submit" class="btn primary full">試合を保存する</button>
</form></section>
<section id="complete-screen" class="screen"><div class="backrow"><button class="back" id="complete-back">‹</button><h2>登録完了</h2></div><div class="summary-box"><div class="check">✓</div><h2>試合を登録しました</h2><p id="complete-summary" class="muted"></p></div><button class="btn primary full" id="continue-btn">＋ 続けて登録する</button><button class="btn outline full" id="return-btn" style="margin-top:10px">試合一覧へ戻る</button></section>
</main><nav class="common-footer" aria-label="下部メニュー"><a href="../試合記録/index.html" class="active"><span class="footer-icon">⚾</span>試合</a><a href="../index.html" class=""><span class="footer-icon">⌂</span>ホーム</a><a href="../record-menu.html" class=""><span class="footer-icon">☰</span>その他</a></nav></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script>
<script>
const $=id=>document.getElementById(id);let allGames=[],editingId=null,selectedGrade='all',activeTab='batting';
const battingDefs=[['plate_appearances','打席'],['at_bats','打数'],['hits','安打'],['doubles','二塁打'],['triples','三塁打'],['home_runs','本塁打'],['runs_batted_in','打点'],['runs','得点'],['walks_hit_by_pitch','四死球'],['strikeouts','三振'],['sacrifice_bunts','犠打'],['sacrifice_flies','犠飛']];
const pitchingDefs=[['appearances','登板'],['innings_outs','投球回（アウト数）'],['pitches','投球数'],['hits_allowed','被安打'],['walks','四球'],['hit_by_pitch','死球'],['strikeouts','奪三振'],['runs_allowed','失点'],['earned_runs','自責点']];
function makeFields(target,defs,prefix){$(target).innerHTML=defs.map(([key,label])=>`<div class="field"><label>${label}</label><input type="number" min="0" id="${prefix}-${key}" value="0"></div>`).join('')}
makeFields('batting-fields',battingDefs,'bat');makeFields('pitching-fields',pitchingDefs,'pit');
function val(id){const v=$(id).value;return v===''?null:Number(v)}function text(id){return $(id).value.trim()}function show(screen){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));$(screen).classList.add('active');window.scrollTo({top:0,behavior:'smooth'})}
function resetForm(){editingId=null;$('form-title').textContent='試合の登録';$('game-form').reset();$('innings').value=7;$('errors').value='0';battingDefs.forEach(([k])=>$('bat-'+k).value=0);pitchingDefs.forEach(([k])=>$('pit-'+k).value=0);$('era-display').value='';$('form-status').textContent='';setTab('batting')}
function setTab(tab){activeTab=tab;document.querySelectorAll('#record-tabs button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));['batting','pitching','fielding'].forEach(t=>$(`${t}-panel`).classList.toggle('hidden',t!==tab))}
function gradeOf(date){return date?String(new Date(date+'T00:00:00').getFullYear()-2025):''}
function filtered(){const o=$('opponent-filter').value.trim().toLowerCase();return allGames.filter(g=>(selectedGrade==='all'||gradeOf(g.game_date)===selectedGrade)&&(!o||(g.opponent||'').toLowerCase().includes(o)))}
function fmtDate(d){if(!d)return'';const x=new Date(d+'T00:00:00');return `${x.getMonth()+1}/${x.getDate()}（${'日月火水木金土'[x.getDay()]}）`}
function result(g){if(g.team_score==null||g.opponent_score==null)return'';return g.team_score>g.opponent_score?'勝':g.team_score<g.opponent_score?'負':'分'}
function render(){const games=filtered();$('count-label').textContent=`${games.length}試合`;$('list-status').textContent='';$('games-list').innerHTML=games.length?games.map(g=>`<article class="card game-card"><div class="game-head"><span class="date">${fmtDate(g.game_date)}</span><span class="badge">${g.game_type||'試合'}</span></div><div class="muted">${g.tournament_name||'大会名未入力'}</div><div class="opponent">vs ${esc(g.opponent)}</div><div><span class="score">${g.team_score??'-'} - ${g.opponent_score??'-'}</span><span class="result">${result(g)}</span></div><div class="game-meta">7回</div><details class="detail"><summary>打撃・投手・守備の記録を確認</summary><div id="detail-${g.id}" class="status">読み込み中…</div></details><div class="actions"><button class="edit" onclick="editGame(${g.id})">編集</button><button class="delete" onclick="deleteGame(${g.id})">削除</button></div></article>`).join(''):'<div class="empty">条件に一致する試合がありません。<br>「試合を追加」から登録してください。</div>';games.forEach(g=>loadDetails(g.id))}
function esc(s){return String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
async function loadDetails(id){const [b,p,f]=await Promise.all([supabaseClient.from('batting_records').select('*').eq('game_id',id).maybeSingle(),supabaseClient.from('pitching_records').select('*').eq('game_id',id).maybeSingle(),supabaseClient.from('fielding_records').select('*').eq('game_id',id).maybeSingle()]);const el=$('detail-'+id);if(!el)return;el.innerHTML=`<div>打撃：${b.data?`打率 ${b.data.at_bats? (b.data.hits/b.data.at_bats).toFixed(3):'.000'} ／ ${b.data.hits}安打`:'未入力'}</div><div>投手：${p.data?`投球回 ${Math.floor((p.data.innings_outs||0)/3)}回 ／ 奪三振 ${p.data.strikeouts||0}`:'未入力'}</div><div>守備：${f.data?`${esc(f.data.position||'')} ／ エラー ${f.data.errors||0}`:'未入力'}</div>`}
async function loadGames(){const {data,error}=await supabaseClient.from('games').select('*').order('game_date',{ascending:false}).order('id',{ascending:false});if(error){$('list-status').textContent='読み込みエラー：'+error.message;return}allGames=data||[];render()}
function fill(prefix,record,defs){defs.forEach(([k])=>$(prefix+'-'+k).value=record?.[k]??0)}
async function editGame(id){const g=allGames.find(x=>x.id===id);if(!g)return;editingId=id;$('form-title').textContent='試合の編集';['game-date','tournament-name','game-type','opponent','team-score','opponent-score','game-note'].forEach((id)=>{const map={'game-date':'game_date','tournament-name':'tournament_name','game-type':'game_type','opponent':'opponent','team-score':'team_score','opponent-score':'opponent_score','game-note':'note'};$(id).value=g[map[id]]??''});const [b,p,f]=await Promise.all([supabaseClient.from('batting_records').select('*').eq('game_id',id).maybeSingle(),supabaseClient.from('pitching_records').select('*').eq('game_id',id).maybeSingle(),supabaseClient.from('fielding_records').select('*').eq('game_id',id).maybeSingle()]);fill('bat',b.data,battingDefs);fill('pit',p.data,pitchingDefs);$('batting-note').value=b.data?.note||'';$('pitching-note').value=p.data?.note||'';$('field-position').value=f.data?.position||'';$('errors').value=f.data?.errors?'1':'0';$('error-note').value=f.data?.error_note||'';$('fielding-note').value=f.data?.note||'';calcEra();show('form-screen')}
async function deleteGame(id){if(!confirm('この試合記録を削除しますか？'))return;const {error}=await supabaseClient.from('games').delete().eq('id',id);if(error){alert(error.message);return}await loadGames()}
function calcEra(){const outs=val('pit-innings_outs'),er=val('pit-earned_runs');$('era-display').value=outs>0?(er*21/outs).toFixed(2):''}
async function saveForm(e){e.preventDefault();$('form-status').textContent='保存中…';const game={game_date:text('game-date'),game_type:text('game-type')||null,tournament_name:text('tournament-name')||null,opponent:text('opponent'),team_score:val('team-score'),opponent_score:val('opponent-score'),result:result({team_score:val('team-score'),opponent_score:val('opponent-score')}),note:text('game-note')||null};let gameId=editingId;if(gameId){const r=await supabaseClient.from('games').update(game).eq('id',gameId).select().single();if(r.error){$('form-status').textContent=r.error.message;return}}else{const r=await supabaseClient.from('games').insert(game).select().single();if(r.error){$('form-status').textContent=r.error.message;return}gameId=r.data.id}
const batting={game_id:gameId,...Object.fromEntries(battingDefs.map(([k])=>[k,val('bat-'+k)])),note:text('batting-note')||null};const pitching={game_id:gameId,...Object.fromEntries(pitchingDefs.map(([k])=>[k,val('pit-'+k)])),note:text('pitching-note')||null};const fielding={game_id:gameId,position:text('field-position')||null,errors:val('errors')||0,error_note:text('error-note')||null,note:text('fielding-note')||null};for(const [table,data] of [['batting_records',batting],['pitching_records',pitching],['fielding_records',fielding]]){const r=await supabaseClient.from(table).upsert(data,{onConflict:'game_id'});if(r.error){$('form-status').textContent=table+'：'+r.error.message;return}}$('complete-summary').textContent=`${fmtDate(game.game_date)}　vs ${game.opponent}　${game.team_score??'-'} - ${game.opponent_score??'-'}`;show('complete-screen');await loadGames()}
$('game-form').addEventListener('submit',saveForm);$('save-btn').addEventListener('click',()=>$('game-form').requestSubmit());$('add-btn').addEventListener('click',()=>{resetForm();show('form-screen')});$('form-back').addEventListener('click',()=>show('list-screen'));$('complete-back').addEventListener('click',()=>show('list-screen'));$('continue-btn').addEventListener('click',()=>{resetForm();show('form-screen')});$('return-btn').addEventListener('click',()=>show('list-screen'));document.querySelectorAll('#record-tabs button').forEach(b=>b.addEventListener('click',()=>setTab(b.dataset.tab)));['pit-innings_outs','pit-earned_runs'].forEach(id=>$(id).addEventListener('input',calcEra));$('opponent-filter').addEventListener('input',render);document.querySelectorAll('#grade-tabs button').forEach(b=>b.addEventListener('click',()=>{selectedGrade=b.dataset.grade;document.querySelectorAll('#grade-tabs button').forEach(x=>x.classList.toggle('active',x===b));render()}));loadGames();
</script></body></html>

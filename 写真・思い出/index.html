<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>写真・思い出</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#f3f6f8;
  color:#102b4e;
  font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif
}

header{
  background:#102b4e;
  color:#fff;
  padding:20px
}

header h1{
  font-size:22px;
  margin:0 0 5px
}

header p{
  font-size:12px;
  margin:0;
  opacity:.85;
  color:#fff
}

header .wrap{
  padding:0
}

.wrap{
  max-width:680px;
  margin:auto;
  padding:18px 16px 100px
}

.top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:18px
}

.btn{
  border:0;
  border-radius:25px;
  padding:12px 18px;
  font-weight:700;
  cursor:pointer
}

.primary{
  background:#ed1c2e;
  color:#fff
}

.light{
  background:#e9f1f6;
  color:#183a60
}

.card{
  background:#fff;
  border-radius:18px;
  padding:18px;
  margin:12px 0;
  box-shadow:0 3px 14px #102f5512
}

/* 野球用品画面と同じ学年フィルター */
.grade-filter{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:5px;
  background:#eaf0f5;
  padding:5px;
  border-radius:14px;
  margin-bottom:15px
}

.grade-filter button{
  border:0;
  border-radius:10px;
  padding:11px 4px;
  background:transparent;
  color:#728096;
  font-weight:700;
  font-size:16px;
  cursor:pointer
}

.grade-filter button.active{
  background:#ed1c2e;
  color:#fff
}

.field{
  margin:12px 0
}

.field label{
  display:block;
  font-weight:700;
  margin-bottom:7px
}

.field input,
.field select,
.field textarea{
  width:100%;
  padding:13px;
  border:1px solid #d4e0eb;
  border-radius:12px;
  font:inherit;
  background:#fbfdff
}

.field textarea{
  min-height:110px;
  resize:vertical
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px
}

.muted{
  color:#71839a;
  font-size:13px
}

.hidden{
  display:none
}

.msg{
  margin:10px 0;
  color:#ed1c2e;
  font-weight:700
}

.empty{
  text-align:center;
  padding:35px;
  color:#71839a
}


.preview{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:8px;
  margin-top:8px
}

.preview img{
  width:100%;
  aspect-ratio:4/3;
  object-fit:cover;
  border-radius:12px
}
/* 写真・思い出：縦型カード表示 */

.item-head{
  display:block;
}

.item{
  width:100%;
}

/* タイトル・出来事 */
.item h3{
  margin:0 0 14px;
  font-size:26px;
  line-height:1.35;
  color:#102b4e;
  font-weight:800;
}

/* 写真 */
.photos{
  display:block;
  margin:0 0 18px;
}

.photos img{
  display:block;
  width:100%;
  height:auto;
  aspect-ratio:4 / 3;
  object-fit:cover;
  border-radius:0;
  background:#eef3f7;
  margin:0 0 10px;
}

.photos img:last-child{
  margin-bottom:0;
}

/* 日付 */
.item-date{
  display:block;
  margin:0 0 18px;
  color:#102b4e;
  font-size:18px;
  line-height:1.5;
}

/* カテゴリ・試合名・相手・場所 */
.item-meta{
  display:flex;
  align-items:center;
  flex-wrap:wrap;
  gap:0;
  margin:0 0 6px;
  font-size:18px;
  color:#102b4e;
  line-height:1.5;
}

.item-meta .dot{
  margin:0 14px;
  color:#102b4e;
}

.item-note{
  display:block;
  width:100%;
  margin:0;
  padding:0;
  font-size:18px;
  line-height:1.7;
  color:#102b4e;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
  text-align:left;
  text-indent:0;

  /* メモは2行分の高さを確保 */
  min-height:3.4em;
}

.item-actions{
  display:flex;
  justify-content:flex-end;
  gap:14px;
  margin-top:6px;
}

.item-icon-btn{
  border:0;
  background:transparent;
  color:#647c95;
  font-size:21px;
  padding:4px;
  cursor:pointer;
  line-height:1;
}

.item-icon-btn:hover{
  color:#102b4e;
}


/* 編集・削除 */
.item-actions{
  display:flex;
  justify-content:flex-end;
  gap:14px;
  margin-top:18px;
}

.item-icon-btn{
  border:0;
  background:transparent;
  color:#647c95;
  font-size:21px;
  padding:4px;
  cursor:pointer;
  line-height:1;
}

.item-icon-btn:hover{
  color:#102b4e;
}

@media(max-width:480px){
  .grid{
    grid-template-columns:1fr
  }

  .top{
    align-items:stretch;
    flex-direction:column
  }

  .photos{
    grid-template-columns:1fr 1fr
  }
}
</style>

<style id="unified-navigation-style">
.unified-nav{
  position:sticky;
  top:0;
  z-index:50;
  background:#0b223d;
  padding:9px 10px;
  box-shadow:0 2px 8px rgba(0,0,0,.12);
  overflow-x:auto;
  -webkit-overflow-scrolling:touch
}

.unified-nav-inner{
  display:flex;
  gap:7px;
  min-width:max-content;
  max-width:520px;
  margin:0 auto
}

.unified-nav a{
  display:block;
  text-decoration:none;
  white-space:nowrap;
  border:1px solid rgba(255,255,255,.35);
  border-radius:18px;
  padding:8px 12px;
  color:#fff;
  font-size:12px;
  font-weight:700;
  background:rgba(255,255,255,.08)
}

.unified-nav a.active{
  background:#e92332;
  border-color:#e92332
}

@media(min-width:700px){
  .unified-nav-inner{
    max-width:900px;
    justify-content:center
  }

  .unified-nav a{
    font-size:13px;
    padding:9px 14px
  }
}
</style>

<style id="common-footer-style">
.common-footer{
  display:flex;
  gap:8px;
  padding:12px 18px 18px;
  border-top:1px solid #e7edf2;
  background:#fff
}

.common-footer a{
  flex:1;
  text-align:center;
  text-decoration:none;
  color:#526d86;
  font-size:11px;
  padding:7px 2px;
  border-radius:12px
}

.common-footer a .footer-icon{
  display:block;
  font-size:22px;
  line-height:1.2;
  margin-bottom:4px
}

.common-footer a.active{
  color:#e92332;
  font-weight:800
}
</style>

</head>

<body>

<nav class="unified-nav" aria-label="記録メニュー">
  <div class="unified-nav-inner">
    <a href="../試合記録/index.html">試合記録</a>
    <a href="../成長記録/index.html">成長記録</a>
    <a href="../練習記録/index.html">練習記録</a>
    <a href="../ケガ・コンディション/index.html">ケガ・コンディション</a>
    <a href="../野球用品/index.html">野球用品</a>
    <a href="../写真・思い出/index.html" class="active">写真・思い出</a>
  </div>
</nav>

<header>
  <div class="wrap">
    <h1>写真・思い出</h1>
    <p>野球の日々を写真とメモで残す</p>
  </div>
</header>

<main class="wrap">

  <div class="top">
    <button class="btn light" onclick="showList()">← 一覧へ</button>
    <button class="btn primary" onclick="showForm()">＋ 思い出を追加</button>
  </div>

  <section id="list-view">

    <div class="card">

      <!-- 野球用品と同じ学年フィルター -->
      <div class="grade-filter">
        <button type="button" class="active" data-grade="all">すべて</button>
        <button type="button" data-grade="中1">中1</button>
        <button type="button" data-grade="中2">中2</button>
        <button type="button" data-grade="中3">中3</button>
      </div>

      <div class="field">
        <label>カテゴリ・メモで検索</label>
        <input
          id="keyword-filter"
          type="search"
          placeholder="カテゴリ・メモで検索"
        >
      </div>

      <button class="btn light" onclick="clearFilters()">
        絞り込みを解除
      </button>

    </div>

    <div id="list"></div>

  </section>


  <section id="form-view" class="hidden">

    <div class="card">

      <h2 id="form-title">思い出を登録</h2>

      <input type="hidden" id="edit-id">
      <input type="hidden" id="photo-url-1">
      <input type="hidden" id="photo-url-2">

      <div class="grid">

        <div class="field">
          <label>日付 *</label>
          <input type="date" id="record-date" required>
        </div>

        <div class="field">
          <label>カテゴリ *</label>
          <select id="category">
            <option value="試合">試合</option>
            <option value="練習">練習</option>
            <option value="日常">日常</option>
            <option value="その他">その他</option>
          </select>
        </div>

      </div>

      <div class="field">
        <label>タイトル・出来事 *</label>
        <input
          id="title"
          placeholder="例：ピッチャー復活の日、父とのシャトル練習"
          required
        >
      </div>

      <div class="field">
        <label>試合名・相手・場所など</label>
        <input
          id="event-info"
          placeholder="例：○○大会 vs ○○中、近所の公園"
        >
      </div>

      <div class="field">

        <label>写真（最大2枚）</label>

        <input
          type="file"
          id="photos-input"
          accept="image/*"
          multiple
        >

        <div class="muted">
          写真のトリミング・編集は行いません。
          必要な場合は事前に端末側で編集してください。
        </div>

        <div id="preview" class="preview"></div>

      </div>

      <div class="field">

        <label>メモ</label>

        <textarea
          id="note"
          maxlength="500"
          placeholder="その日の出来事、印象に残った言葉、できるようになったことなど"
        ></textarea>

        <div class="muted" id="count">0 / 500</div>

      </div>

      <div id="message" class="msg"></div>

      <div class="actions">
        <button class="btn primary" onclick="saveRecord()">
          保存する
        </button>

        <button class="btn light" onclick="showList()">
          キャンセル
        </button>
      </div>

    </div>

  </section>

</main>


<script>

const $ = id => document.getElementById(id);

let records = [];


/* Supabaseクライアント */
function client(){
  try{
    return typeof supabaseClient !== 'undefined'
      ? supabaseClient
      : window.supabaseClient;
  }catch(e){
    return window.supabaseClient;
  }
}


/* 一覧表示 */
function showList(){

  $('form-view').classList.add('hidden');
  $('list-view').classList.remove('hidden');

  loadRecords();
}


/* 登録・編集フォーム */
function showForm(record=null){

  $('list-view').classList.add('hidden');
  $('form-view').classList.remove('hidden');

  $('form-title').textContent =
    record ? '思い出を編集' : '思い出を登録';

  $('edit-id').value = record?.id || '';

  $('record-date').value =
    record?.record_date ||
    new Date().toISOString().slice(0,10);

  $('category').value =
    record?.category || '試合';

  $('title').value =
    record?.title || '';

  $('event-info').value =
    record?.event_info || '';

  $('note').value =
    record?.note || '';

  $('photos-input').value = '';

  $('photo-url-1').value =
    record?.photo_url_1 || '';

  $('photo-url-2').value =
    record?.photo_url_2 || '';

  renderPreview(
    [record?.photo_url_1,record?.photo_url_2]
      .filter(Boolean)
  );

  $('message').textContent = '';

  updateCount();

  window.scrollTo(0,0);
}


/* 写真プレビュー */
function renderPreview(urls){

  $('preview').innerHTML =
    urls.map(
      u => `<img src="${esc(u)}" alt="写真プレビュー">`
    ).join('');
}


/* Supabaseからデータ取得 */
async function loadRecords(){

  const c = client();

  if(!c){

    $('list').innerHTML =
      '<div class="card msg">Supabase接続設定が読み込まれていません。</div>';

    return;
  }

  const {
    data,
    error
  } = await c
    .from('photo_memory_records')
    .select('*')
    .order('record_date',{ascending:false})
    .order('created_at',{ascending:false});

  if(error){

    $('list').innerHTML =
      '<div class="card msg">読み込みエラー：'
      + esc(error.message)
      + '</div>';

    return;
  }

  records = data || [];

  render();
}


/* 年から学年を判定 */
function gradeOf(date){

  if(!date){
    return '';
  }

  const year =
    Number(String(date).slice(0,4));

  if(year === 2026){
    return '中1';
  }

  if(year === 2027){
    return '中2';
  }

  if(year === 2028){
    return '中3';
  }

  return '';
}


/* 一覧表示・絞り込み */
function render(){

  const activeGrade =
    document.querySelector(
      '.grade-filter button.active'
    )?.dataset.grade || 'all';

  const keyword =
    $('keyword-filter').value
      .trim()
      .toLowerCase();


  const filtered =
    records.filter(record => {

      /* 学年条件 */
      const gradeMatch =
        activeGrade === 'all' ||
        gradeOf(record.record_date) === activeGrade;


      /* カテゴリ OR メモ */
      const category =
  String(record.category || '')
    .trim()
    .toLowerCase();

const title =
  String(record.title || '')
    .trim()
    .toLowerCase();

const eventInfo =
  String(record.event_info || '')
    .trim()
    .toLowerCase();

const note =
  String(record.note || '')
    .trim()
    .toLowerCase();

const keywordMatch =
  !keyword ||
  category.includes(keyword) ||
  title.includes(keyword) ||
  eventInfo.includes(keyword) ||
  note.includes(keyword);


      return gradeMatch && keywordMatch;

    });


  if(!filtered.length){

    $('list').innerHTML =
      '<div class="card empty">登録された写真・思い出はありません。</div>';

    return;
  }


  $('list').innerHTML =
  filtered
    .map(record => {

      /* 写真 */
      const urls = [
        record.photo_url_1,
        record.photo_url_2
      ].filter(Boolean);


      const photos =
        urls.length
          ? `
            <div class="photos">
              ${
                urls
                  .map(url => `
                    <img
                      src="${esc(url)}"
                      alt="思い出の写真"
                    >
                  `)
                  .join('')
              }
            </div>
          `
          : '';


      /* カテゴリ */
      const category =
        record.category
          ? esc(record.category)
          : '';


      /* 試合名・相手・場所など */
      const eventInfo =
        record.event_info
          ? esc(record.event_info)
          : '';


      /* カテゴリ・試合情報 */
      const metaParts = [];

      if(category){
        metaParts.push(
          `<span>${category}</span>`
        );
      }

      if(eventInfo){
        metaParts.push(
          `<span>${eventInfo}</span>`
        );
      }


      const meta =
        metaParts.length
          ? `
            <div class="item-meta">

              ${
                metaParts
                  .map(
                    (text,index) =>
                      index === 0
                        ? text
                        : `
                          <span class="dot">
                            ・
                          </span>
                          ${text}
                        `
                  )
                  .join('')
              }

            </div>
          `
          : '';


      /* メモ */
      const noteText =
        String(record.note || '')
          .replace(/^[\s\u3000]+/gm,'')
          .trim();


      const note =
  noteText
    ? `<div class="item-note">${esc(noteText)}</div>`
    : '';


      return `
        <div class="card item">

          <!-- タイトル・出来事 -->
          <h3>
            ${esc(record.title || '')}
          </h3>


          <!-- 写真 -->
          ${photos}


          <!-- 日付 -->
          <div class="item-date">
            📅
            ${esc(record.record_date || '')}
          </div>


          <!-- カテゴリ・試合名・相手・場所 -->
          ${meta}


          <!-- メモ -->
          ${note}


          <!-- 編集・削除 -->
          <div class="item-actions">

            <button
              class="item-icon-btn"
              type="button"
              onclick="editRecord(${record.id})"
              aria-label="編集"
              title="編集"
            >
              ✎
            </button>


            <button
              class="item-icon-btn"
              type="button"
              onclick="deleteRecord(${record.id})"
              aria-label="削除"
              title="削除"
            >
              🗑
            </button>

          </div>

        </div>
      `;

    })
    .join('');
}


/* HTMLエスケープ */
function esc(value){

  return String(value ?? '')
    .replace(
      /[&<>"']/g,
      character => ({
        '&':'&amp;',
        '<':'&lt;',
        '>':'&gt;',
        '"':'&quot;',
        "'":'&#39;'
      }[character])
    );
}


/* 保存 */
async function saveRecord(){

  const c = client();

  $('message').textContent = '';


  if(!c){

    $('message').textContent =
      'Supabase接続設定が読み込まれていません。';

    return;
  }


  const title =
    $('title').value.trim();


  if(!title){

    $('message').textContent =
      'タイトル・出来事を入力してください。';

    return;
  }


  let urls = [
    $('photo-url-1').value || null,
    $('photo-url-2').value || null
  ];


  const files =
    [...$('photos-input').files].slice(0,2);


  for(let i=0;i<files.length;i++){

    const file = files[i];

    const path =
      Date.now()
      + '_'
      + i
      + '_'
      + file.name.replace(
        /[^a-zA-Z0-9._-]/g,
        '_'
      );


    const upload =
      await c
        .storage
        .from('memory-photos')
        .upload(
          path,
          file,
          {upsert:true}
        );


    if(upload.error){

      $('message').textContent =
        '写真を保存できませんでした：'
        + upload.error.message;

      return;
    }


    urls[i] =
      c.storage
        .from('memory-photos')
        .getPublicUrl(path)
        .data.publicUrl;
  }


  const payload = {

    record_date:
      $('record-date').value,

    category:
      $('category').value,

    title:
      title,

    event_info:
      $('event-info').value.trim() || null,

    note:
      $('note').value.trim() || null,

    photo_url_1:
      urls[0],

    photo_url_2:
      urls[1]

  };


  const id =
    $('edit-id').value;


  const result =
    id
      ? await c
          .from('photo_memory_records')
          .update(payload)
          .eq('id',id)

      : await c
          .from('photo_memory_records')
          .insert(payload);


  if(result.error){

    $('message').textContent =
      '保存できませんでした：'
      + result.error.message;

    return;
  }


  showList();
}


/* 編集 */
function editRecord(id){

  const record =
    records.find(
      item => item.id === id
    );

  if(record){
    showForm(record);
  }
}


/* 削除 */
async function deleteRecord(id){

  if(
    !confirm(
      'この写真・思い出を削除しますか？'
    )
  ){
    return;
  }


  const c = client();


  const {
    error
  } =
    await c
      .from('photo_memory_records')
      .delete()
      .eq('id',id);


  if(error){

    alert(
      '削除できませんでした：'
      + error.message
    );

    return;
  }


  loadRecords();
}


/* 絞り込み解除 */
function clearFilters(){

  $('keyword-filter').value = '';


  document
    .querySelectorAll('.grade-filter button')
    .forEach(button => {

      button.classList.toggle(
        'active',
        button.dataset.grade === 'all'
      );

    });


  render();
}


/* メモ文字数 */
function updateCount(){

  $('count').textContent =
    $('note').value.length
    + ' / 500';
}


/* 学年ボタン */
document
  .querySelectorAll('.grade-filter button')
  .forEach(button => {

    button.addEventListener(
      'click',
      () => {

        document
          .querySelectorAll('.grade-filter button')
          .forEach(item =>
            item.classList.toggle(
              'active',
              item === button
            )
          );

        render();
      }
    );

  });


/* 検索 */
$('keyword-filter')
  .addEventListener(
    'input',
    render
  );


/* 写真選択 */
$('photos-input')
  .addEventListener(
    'change',
    () => {

      renderPreview(
        [...$('photos-input').files]
          .slice(0,2)
          .map(
            file =>
              URL.createObjectURL(file)
          )
      );

    }
  );


/* メモ文字数 */
$('note')
  .addEventListener(
    'input',
    updateCount
  );


/* 初期読み込み */
loadRecords();

</script>
